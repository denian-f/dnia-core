<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Senha - DNA Connect</title>
    <link rel="stylesheet" href="/dashboard/static/css/tokens.css">
    <link rel="stylesheet" href="/dashboard/static/css/nav.css">
    <link rel="stylesheet" href="/profile/static/css/change_password.css">
</head>
<body class="has-sidebar">

    {% include "_nav.html" %}

    <div class="app-shell-main">
        <main class="app-content">

            <h1 class="form-page-title">Alterar Senha</h1>
            <p class="form-page-subtitle">Escolha uma nova senha de acesso</p>

            <form class="change-password-form" method="post" action="/change-password">

                <label for="current_password">Senha atual</label>
                <input type="password" id="current_password" name="current_password" required>

                <label for="new_password">Nova senha</label>
                <input type="password" id="new_password" name="new_password" required>

                <label for="confirm_password">Confirmar nova senha</label>
                <input type="password" id="confirm_password" name="confirm_password" required>

                <div class="change-password-actions">
                    <button type="submit" class="btn-save">Salvar</button>
                    <a href="/dashboard/view" class="btn-cancel">Cancelar</a>
                </div>

                {% if erro %}
                <p class="change-password-message change-password-error">{{ erro }}</p>
                {% endif %}

                {% if sucesso %}
                <p class="change-password-message change-password-success">{{ sucesso }}</p>
                {% endif %}

            </form>

        </main>
    </div>

</body>
</html>
