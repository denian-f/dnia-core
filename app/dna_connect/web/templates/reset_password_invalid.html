<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link inválido - DNA Connect</title>
    <link rel="stylesheet" href="/login/static/css/login.css">
    <link rel="stylesheet" href="/login/static/css/verify_email.css">
</head>
<body>

    <main class="login-container">

        <h1 class="login-title">Link inválido</h1>

        <div class="verify-box">

            <p class="verify-text verify-text-error">
                Este link de recuperação é inválido ou expirou.
            </p>

            <a href="/forgot-password" class="login-button verify-button-link">Solicitar novo link</a>

            <a href="/login/view" class="register-link">Voltar ao login</a>

        </div>

    </main>

</body>
</html>
