<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha - DNA Connect</title>
    <link rel="stylesheet" href="/login/static/css/login.css">
    <link rel="stylesheet" href="/login/static/css/verify_email.css">
</head>
<body>

    <main class="login-container">

        <h1 class="login-title">Recuperar senha</h1>

        <form class="login-form" method="post" action="/forgot-password">

            <p class="verify-text">
                Informe o e-mail da sua conta. Se ele estiver cadastrado, enviaremos
                um link para você redefinir sua senha.
            </p>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <button type="submit" class="login-button">Enviar link de recuperação</button>

            {% if mensagem %}
            <p class="verify-message">{{ mensagem }}</p>
            {% endif %}

        </form>

        <a href="/login/view" class="register-link">Voltar para o login</a>

    </main>

</body>
</html>
