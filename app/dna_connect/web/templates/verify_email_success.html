<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-mail verificado - DNA Connect</title>
    <link rel="stylesheet" href="/dashboard/static/css/tokens.css">
    <link rel="stylesheet" href="/login/static/css/login.css">
    <link rel="stylesheet" href="/login/static/css/register.css">
    <link rel="stylesheet" href="/login/static/css/verify_email.css">
</head>
<body>

    <div class="auth-shell">

        <div class="auth-hero">
            <span class="dc-logo"><img src="/dashboard/static/img/dna-logo-icon.svg" alt="" width="26" height="20"><span class="dc-logo-text dc-logo-text-light">DNA Connect</span></span>
            <div class="auth-hero-tagline">
                <p>Seu cartão digital.<br><span>Sempre com você.</span></p>
                <p>Crie e gerencie cartões de visita digitais conectados via NFC e QR Code.</p>
            </div>
            <div class="auth-hero-footer">© 2026 DNA Connect</div>
        </div>

        <div class="auth-form-area">

            <div class="auth-mobile-logo">
                <span class="dc-logo"><img src="/dashboard/static/img/dna-logo-icon.svg" alt="" width="24" height="19"><span class="dc-logo-text">DNA Connect</span></span>
            </div>

            <main class="login-container">

                <div class="form-card">

                    <div class="verify-icon verify-icon-success">
                        <svg width="26" height="26" fill="none" stroke="#065f46" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>
                    </div>

                    <div class="verify-box">
                        <h1 class="login-title" style="text-align:center;">E-mail verificado!</h1>
                        <p class="verify-text">Sua conta está confirmada e pronta para uso.</p>

                        <a href="/login/view" class="login-button verify-button-link">Entrar na plataforma</a>
                    </div>

                </div>

            </main>

        </div>

    </div>

</body>
</html>
