<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definir nova senha - DNA Connect</title>
    <link rel="stylesheet" href="/login/static/css/login.css">
</head>
<body>

    <main class="login-container">

        <h1 class="login-title">Definir nova senha</h1>

        <form class="login-form" method="post" action="/reset-password">

            <input type="hidden" name="token" value="{{ token }}">

            <label for="password">Nova senha</label>
            <input type="password" id="password" name="password" required>

            <label for="confirm_password">Confirmar nova senha</label>
            <input type="password" id="confirm_password" name="confirm_password" required>

            <button type="submit" class="login-button">Alterar senha</button>

            {% if erro %}
            <p class="login-error">{{ erro }}</p>
            {% endif %}

        </form>

    </main>

</body>
</html>
