<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definir nova senha - DNA Connect</title>
    <link rel="stylesheet" href="/dashboard/static/css/tokens.css">
    <link rel="stylesheet" href="/login/static/css/login.css">
</head>
<body>

    <div class="auth-shell">

        <div class="auth-hero">
            <span class="dc-logo"><img src="/dashboard/static/img/dna-logo-icon.svg" alt="" width="26" height="20"><span class="dc-logo-text dc-logo-text-light">DNA Connect</span></span>
            <div class="auth-hero-tagline">
                <p>Seu cartão digital.<br><span>Sempre com você.</span></p>
                <p>Crie e gerencie cartões de visita digitais conectados via NFC e QR Code.</p>
            </div>
            <div class="auth-hero-footer">© 2026 DNA Connect</div>
        </div>

        <div class="auth-form-area">

            <div class="auth-mobile-logo">
                <span class="dc-logo"><img src="/dashboard/static/img/dna-logo-icon.svg" alt="" width="24" height="19"><span class="dc-logo-text">DNA Connect</span></span>
            </div>

            <main class="login-container">

                <div class="form-card">

                    <h1 class="login-title">Definir nova senha</h1>
                    <p class="form-subtitle">Escolha uma senha forte para proteger sua conta.</p>

                    <form class="login-form" method="post" action="/reset-password">

                        <input type="hidden" name="token" value="{{ token }}">

                        <div>
                            <label for="password">Nova senha</label>
                            <input type="password" id="password" name="password" required>
                        </div>

                        <div>
                            <label for="confirm_password">Confirmar nova senha</label>
                            <input type="password" id="confirm_password" name="confirm_password" required>
                        </div>

                        {% if erro %}
                        <p class="login-error">{{ erro }}</p>
                        {% endif %}

                        <button type="submit" class="login-button">Alterar senha</button>

                    </form>

                </div>

            </main>

        </div>

    </div>

</body>
</html>
