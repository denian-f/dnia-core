<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DNA Connect</title>
    <link rel="stylesheet" href="/login/static/css/login.css">
    <link rel="stylesheet" href="/login/static/css/register.css">
</head>
<body>

    <main class="login-container">

        <h1 class="login-title">DNA Connect</h1>

        <form class="login-form" method="post" action="/login/view">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required>

            <button type="submit" class="login-button">Entrar</button>

            {% if erro %}
            <p class="login-error">{{ erro }}</p>
            {% endif %}

            {% if email_nao_verificado %}
            <a href="/verify-email/pending?email={{ email_nao_verificado }}" class="register-link">
                Reenviar e-mail de verificação
            </a>
            {% endif %}

        </form>

        <p class="register-prompt">Ainda não possui uma conta?</p>
        <a href="/register/view" class="register-link">Criar conta</a>

    </main>

</body>
</html>
