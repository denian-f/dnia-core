<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - DNA Connect</title>
    <link rel="stylesheet" href="/login/static/css/login.css">
    <link rel="stylesheet" href="/login/static/css/register.css">
</head>
<body>

    <main class="login-container">

        <h1 class="login-title">DNA Connect</h1>

        <form class="login-form" method="post" action="/register/view">

            <label for="name">Nome</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required>

            <label for="confirm_password">Confirmar senha</label>
            <input type="password" id="confirm_password" name="confirm_password" required>

            <button type="submit" class="login-button">Criar conta</button>

            {% if erro %}
            <p class="login-error">{{ erro }}</p>
            {% endif %}

        </form>

        <a href="/login/view" class="register-link">Já tenho uma conta</a>

    </main>

</body>
</html>
