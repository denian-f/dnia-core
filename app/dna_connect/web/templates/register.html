            <main class="login-container">

                <div class="form-card">

                    <h1 class="login-title">Criar conta</h1>
                    <p class="form-subtitle">Preencha os dados abaixo para começar.</p>

                    <form class="login-form" method="post" action="/register/view">

                        <div>
                            <label for="name">Nome</label>
                            <input type="text" id="name" name="name" required>
                        </div>

                        <div>
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div>
                            <label for="password">Senha</label>
                            <input type="password" id="password" name="password" required>
                        </div>

                        <div>
                            <label for="confirm_password">Confirmar senha</label>
                            <input type="password" id="confirm_password" name="confirm_password" required>
                        </div>

                        {% if erro %}
                        <p class="login-error">{{ erro }}</p>
                        {% endif %}

                        <button type="submit" class="login-button">Criar conta</button>

                    </form>

                </div>

                <p class="auth-below-card">
                    <span class="register-prompt">Já tem uma conta?</span>
                    <a href="/login/view" class="register-link">Entrar</a>
                </p>

            </main>
